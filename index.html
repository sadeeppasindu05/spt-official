<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SPT OFFICIAL - Sadeep Pasindu Creative Universe</title>
    <meta name="description" content="SPT OFFICIAL - Sadeep Pasindu Creative Universe. Premium AI-powered digital services, tools, and creative solutions." />
    <meta name="theme-color" content="#020617" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function() {
        try {
          var xhr = new XMLHttpRequest();
          xhr.open('GET', '/api/config', false);
          xhr.send(null);
          if (xhr.status === 200) {
            var config = JSON.parse(xhr.responseText);
            window.__SUPABASE_URL__ = config.supabaseUrl;
            window.__SUPABASE_ANON_KEY__ = config.supabaseAnonKey;
          }
        } catch (e) {
          console.error("Failed to load Supabase configuration:", e);
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
